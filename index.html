<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Expired | Billify</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Card Container */
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 5px solid #6366f1; /* Brand Color Accent */
        }

        /* Icon Styling */
        .icon-box {
            background-color: #eef2ff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: #6366f1;
        }

        /* Headings and Text */
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1f2937;
        }

        p {
            font-size: 16px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Button Styling */
        .btn-subscribe {
            display: inline-block;
            background-color: #6366f1; /* Indigo color */
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            cursor: pointer; /* Ensures it looks clickable */
        }

        .btn-subscribe:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Footer text */
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm6 10v8H6v-8h12zm-9-2V7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9z"/>
            </svg>
        </div>

        <h1>Your Free Plan Has Expired</h1>
        
        <p>
            Your access to the free plan has ended. To continue using our services without interruption, please upgrade your subscription.
        </p>

        <a href="#" class="btn-subscribe">
            Subscribe at Billify
        </a>

        <div class="footer-note">
            Need help? Contact Billify Support.
        </div>
    </div>

</body>
</html>
